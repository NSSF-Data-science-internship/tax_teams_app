completion_models:
  default_completion_model:
    type: litellm
    model_provider: gemini
    model: ${GRAPHRAG_COMPLETION_MODEL}
    auth_method: api_key
    api_key: ${GEMINI_API_KEY}
    retry:
      type: exponential_backoff
      max_retries: 3

embedding_models:
  default_embedding_model:
    type: litellm
    model_provider: gemini
    model: ${GRAPHRAG_EMBEDDING_MODEL}
    auth_method: api_key
    api_key: ${GEMINI_API_KEY}
    retry:
      type: exponential_backoff
      max_retries: 3

concurrent_requests: 4

input:
  type: jsonl
  id_column: id
  title_column: title
  text_column: text

input_storage:
  type: file
  base_dir: input

output_storage:
  type: file
  base_dir: output

reporting:
  type: file
  base_dir: logs

cache:
  type: json
  storage:
    type: file
    base_dir: cache

vector_store:
  type: lancedb
  db_uri: output/lancedb

chunking:
  type: tokens
  size: 800
  overlap: 100
  encoding_model: o200k_base
  prepend_metadata: [title, source, section]

extract_graph:
  completion_model_id: default_completion_model
  entity_types: [tax_act, legal_section, tax_type, taxpayer, obligation, exemption, tax_rate, deadline, authority, amendment]
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: default_completion_model

extract_claims:
  enabled: false

community_reports:
  completion_model_id: default_completion_model
  max_length: 1200
  max_input_length: 6000

embed_text:
  embedding_model_id: default_embedding_model

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model

global_search:
  completion_model_id: default_completion_model

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
