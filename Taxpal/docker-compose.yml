services:

  taxpal-bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: taxpal-bot

    ports:
      - "3978:3978"

    environment:
      PORT: "3978"
      LANGFLOW_BASE_URL: "http://langflow:7860"
      LANGFLOW_FLOW_ID: "b2126f6d-83f9-4e82-916c-b60e89a35dce"
      LANGFLOW_API_KEY: ""

    depends_on:
      - langflow
      - qdrant

    restart: unless-stopped


  langflow:
    build:
      context: .
      dockerfile: Dockerfile.langflow

    container_name: taxpal-langflow

    dns:
      - 1.1.1.1
      - 8.8.8.8

    ports:
      - "7860:7860"

    environment:
      LANGFLOW_AUTO_LOGIN: "true"

    env_file:
      - env/.env

    volumes:
      - langflow-data:/app/langflow_data

    depends_on:
      - qdrant

    restart: unless-stopped


  qdrant:
    image: qdrant/qdrant:latest

    container_name: taxpal-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant-data:/qdrant/storage

    restart: unless-stopped


volumes:
  langflow-data:
  qdrant-data:
