services:
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: taxpal-chroma
    ports:
      # Port 8000 is commonly used by local FastAPI projects. TaxPal uses
      # 18000 on the host while containers still connect to chroma:8000.
      - "18000:8000"
    volumes:
      - chroma-data:/data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: taxpal-postgres
    environment:
      POSTGRES_DB: taxpal
      POSTGRES_USER: taxpal
      POSTGRES_PASSWORD: taxpal_dev_password
    ports:
      # Use a project-specific port on Windows to avoid conflicts with locally
      # PostgreSQL server. Containers still reach this service on port 5432.
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxpal -d taxpal"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  taxpal-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxpal-bot
    env_file:
      - ./env/.env.local
    ports:
      - "3978:3978"
    environment:
      PORT: "3978"
      TAXPAL_ENV: "development"
      TAXPAL_PLAYGROUND: "true"
      TAX_SEARCH_URL: "http://tax-search:8001"
      GRAPH_RAG_ENABLED: "true"
      GRAPH_RAG_URL: "http://graph-search:8002"
      GRAPH_RAG_MODE: "auto"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
      tax-search:
        condition: service_healthy
      graph-search:
        condition: service_started
    restart: unless-stopped

  graph-search:
    build:
      context: .
      dockerfile: Dockerfile.graph-search
    container_name: taxpal-graph-search
    env_file:
      - ./env/.env.local
    ports:
      - "8002:8002"
    environment:
      GRAPH_RAG_ROOT: "/graph"
      GRAPHRAG_COMPLETION_MODEL: "${GRAPHRAG_COMPLETION_MODEL:-gemini-2.5-flash-lite}"
      GRAPHRAG_EMBEDDING_MODEL: "${GRAPHRAG_EMBEDDING_MODEL:-gemini-embedding-001}"
      GRAPH_RAG_COMMUNITY_LEVEL: "2"
    volumes:
      - ./graphrag:/graph
      - ./data/chunks:/data/chunks:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  tax-search:
    build:
      context: .
      dockerfile: Dockerfile.tax-search

    container_name: taxpal-tax-search

    ports:
      - "8001:8001"

    environment:
      CHROMA_HOST: "chroma"
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION: "uganda_tax_law"
      HF_HOME: "/root/.cache/huggingface"

    volumes:
      - huggingface-cache:/root/.cache/huggingface

    depends_on:
      chroma:
        condition: service_started

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10m

    restart: unless-stopped
volumes:
  chroma-data:
  postgres-data:
  huggingface-cache:
